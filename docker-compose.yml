# Local production-parity stack: E2E relay on :7860 (Render serves the same image).
# 1-click: docker compose up --build   (no .env required; all keys optional)
services:
  api:
    build: .
    image: kavach:local
    ports: ["${PORT:-7860}:7860"]
    environment:
      PORT: "7860"
      DB_PATH: /data/kavach.db
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:7860
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RC_WEBHOOK_AUTH: ${RC_WEBHOOK_AUTH:-}
    volumes: ["kavach-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:7860/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kavach-data:
