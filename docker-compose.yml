# Local production-parity stack: backend on :7860 (HF serves the same image).
services:
  api:
    build: .
    image: k-voiceops:local
    ports: ["7860:7860"]
    env_file: [.env]
    environment:
      DB_PATH: /data/voiceops.db
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:7860
    volumes: ["voiceops-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:7860/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  voiceops-data:
