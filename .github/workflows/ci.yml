name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r mcp_server/requirements.txt && pip install pytest pytest-asyncio ruff httpx
      - run: ruff check app.py mobile_api.py agent mcp_server tests
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: simulator/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: simulator/web/package.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Run Android Unit Tests & Build Senior + Manager APKs
        env:
          REVENUECAT_KEY: ${{ secrets.REVENUECAT_KEY }}
        run: gradle testSeniorDebugUnitTest testManagerDebugUnitTest assembleSeniorDebug assembleManagerDebug --stacktrace
      - name: Upload Senior APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kavach-senior-apk
          path: android/app/build/outputs/apk/senior/debug/*.apk
          if-no-files-found: warn
      - name: Upload Manager APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kavach-manager-apk
          path: android/app/build/outputs/apk/manager/debug/*.apk
          if-no-files-found: warn
  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t k-voiceops:ci .

