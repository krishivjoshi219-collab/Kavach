[project]
name = "kavach-guardian"
version = "0.1.0"
description = "Kavach: voice guardian + scam shield for seniors (Alexa+ track, real MCP + MCP App)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishiv Joshi" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "mcp>=1.12,<2",
  "httpx>=0.27",
  "google-generativeai>=0.8",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
